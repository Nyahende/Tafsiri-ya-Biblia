name: tafsiri_ya_biblia
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/bible_logo.png"

  adaptive_icon_foreground: "assets/images/bible_logo.png"
  adaptive_icon_background: "#FAF9F6"

  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
flutter_native_splash:
  color: "#FAF9F6"
  image: assets/images/transparent_background.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#FAF9F6"
    image: assets/images/transparent_background.png
    icon_background_color: "#FAF9F6"
