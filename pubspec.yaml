name: jifunzebiblia
publish_to: "none"
version: 1.0.0+23
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  share_plus: ^11.1.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  cross_file: ^0.3.5+2
  package_info_plus: ^8.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon/app_icon.png"
  adaptive_icon_foreground_inset: 20
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
flutter_native_splash:
  color: "#FAF9F6"
  image: assets/images/transparent_background.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#FAF9F6"
    image: assets/images/transparent_background.png
    icon_background_color: "#FAF9F6"
